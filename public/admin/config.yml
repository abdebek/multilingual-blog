# Decap CMS — GitHub OAuth (Cloudflare Pages Functions at /api/auth + /api/callback)
#
# Setup:
# 1. GitHub → Settings → Developer settings → OAuth Apps → New
#    Homepage URL: https://YOUR_DOMAIN
#    Authorization callback URL: https://YOUR_DOMAIN/api/callback
# 2. Cloudflare Pages env: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# 3. Local editing: npm run cms-proxy && open http://localhost:4321/admin/
backend:
  name: github
  repo: abdebek/multilingual-blog
  branch: main
  # Same-origin OAuth (Cloudflare Pages Functions). Leading slash = site root.
  auth_endpoint: /api/auth

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    path: "{{lang}}/{{slug}}"
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Publish Date"
        name: "pubDate"
        widget: "date"
        format: "YYYY-MM-DD"
      - label: "Language"
        name: "lang"
        widget: "select"
        options:
          - { label: "English", value: "en" }
          - { label: "Turkish", value: "tr" }
          - { label: "Arabic", value: "ar" }
        default: "en"
      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Body"
        name: "body"
        widget: "markdown"
